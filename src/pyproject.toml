[project]
name = "qrnn-uq-rul"
version = "0.1.0"
description = "Uncertainty quantification for aero-engine RUL: C-QRNN baseline reproduction and pipeline fixes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.0",
    "torch>=2.14.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: end-to-end multi-arm integration tests (train several models; deselect with -m 'not slow' during dev loops)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
